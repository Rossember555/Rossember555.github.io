<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recurso</title>

<style>
body{margin:0;padding:20px;background:#050801;font-family:'Segoe UI',Tahoma,sans-serif}
.container{max-width:900px;margin:auto}

.slider input{display:none}
.window{overflow:hidden;border-radius:12px;border:1px solid rgba(200,255,1,.2)}
.track{display:flex;width:500%;transition:transform .6s ease}
.track img{width:20%;flex-shrink:0}

#s1:checked~.window .track{transform:translateX(0)}
#s2:checked~.window .track{transform:translateX(-20%)}
#s3:checked~.window .track{transform:translateX(-40%)}
#s4:checked~.window .track{transform:translateX(-60%)}
#s5:checked~.window .track{transform:translateX(-80%)}

.nav{display:none;justify-content:center;gap:10px;margin-top:12px}
#s1:checked~.n1,
#s2:checked~.n2,
#s3:checked~.n3,
#s4:checked~.n4,
#s5:checked~.n5{display:flex}

.btn{padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem}
.prev{border:1px solid #c8ff01;color:#c8ff01;background:transparent}
.next{background:#c8ff01;color:#0a1104;border:1px solid #c8ff01}

.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots label{width:8px;height:8px;border-radius:50%;background:#777;cursor:pointer}
#s1:checked~.dots label:nth-child(1),
#s2:checked~.dots label:nth-child(2),
#s3:checked~.dots label:nth-child(3),
#s4:checked~.dots label:nth-child(4),
#s5:checked~.dots label:nth-child(5){background:#c8ff01}
</style>
</head>

<body>

<div class="container">

  <!-- Bienvenida simplificada -->
  <div style="background:#0a1104;border-left:4px solid #c8ff01;border-radius:10px;padding:14px;margin-bottom:16px;color:#fff">
    <h2 style="margin:0 0 5px;color:#c8ff01;font-size:1.3rem">Bienvenido(a)</h2>
    <p style="margin:0;font-size:.9rem;color:#ccc">Explora el recurso y avanza a tu ritmo.</p>
  </div>

  <!-- Slider -->
  <div class="slider">

    <input type="radio" name="s" id="s1" checked>
    <input type="radio" name="s" id="s2">
    <input type="radio" name="s" id="s3">
    <input type="radio" name="s" id="s4">
    <input type="radio" name="s" id="s5">

    <div class="window">
      <div class="track">
        <img src="https://github.com/Rossember555/Imagenes_Moodle/blob/main/11.png?raw=true">
        <img src="https://github.com/Rossember555/Imagenes_Moodle/blob/main/12.png?raw=true">
        <img src="https://github.com/Rossember555/Imagenes_Moodle/blob/main/13.png?raw=true">
        <img src="https://github.com/Rossember555/Imagenes_Moodle/blob/main/14.png?raw=true">
        <img src="https://github.com/Rossember555/Imagenes_Moodle/blob/main/15.png?raw=true">
      </div>
    </div>

    <!-- Indicadores -->
    <div class="dots">
      <label for="s1"></label>
      <label for="s2"></label>
      <label for="s3"></label>
      <label for="s4"></label>
      <label for="s5"></label>
    </div>

    <!-- Navegación -->
    <div class="nav n1">
      <label for="s5" class="btn prev">←</label>
      <label for="s2" class="btn next">→</label>
    </div>

    <div class="nav n2">
      <label for="s1" class="btn prev">←</label>
      <label for="s3" class="btn next">→</label>
    </div>

    <div class="nav n3">
      <label for="s2" class="btn prev">←</label>
      <label for="s4" class="btn next">→</label>
    </div>

    <div class="nav n4">
      <label for="s3" class="btn prev">←</label>
      <label for="s5" class="btn next">→</label>
    </div>

    <div class="nav n5">
      <label for="s4" class="btn prev">←</label>
      <label for="s1" class="btn next">→</label>
    </div>

  </div>

</div>

</body>
</html>
